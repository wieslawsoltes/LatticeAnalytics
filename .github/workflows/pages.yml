name: Test and deploy Lattice Analytics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run engine and model tests
        run: npm test
      - name: Build application, sample workbook, and Pages site
        run: npm run build:pages
      - name: Verify deployment metadata and entry point
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          const metadata = JSON.parse(fs.readFileSync('_site/build.json', 'utf8'));
          const html = fs.readFileSync('_site/index.html');
          assert.equal(metadata.commit, process.env.GITHUB_SHA);
          assert.equal(metadata.htmlSha256, createHash('sha256').update(html).digest('hex'));
          assert.equal(Buffer.compare(html, fs.readFileSync('dist/lattice.html')), 0);
          console.log('Verified standalone entry point, source commit, and SHA-256 digest.');
          JS
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the public HTTPS deployment
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.request

          base = os.environ['SITE_URL'].rstrip('/') + '/'
          expected = os.environ['EXPECTED_COMMIT']
          if not base.startswith('https://'):
              raise RuntimeError('Deployment must use HTTPS')
          failure = None
          for attempt in range(12):
              try:
                  suffix = '?verify=' + expected + '-' + str(attempt)
                  def read(relative):
                      request = urllib.request.Request(
                          base + relative + suffix,
                          headers={'Cache-Control': 'no-cache', 'User-Agent': 'Lattice-Pages-Verification'},
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.status != 200:
                              raise RuntimeError('Unexpected HTTP status: ' + str(response.status))
                          return response.read()
                  metadata = json.loads(read('build.json'))
                  html = read('')
                  if metadata.get('commit') != expected:
                      raise RuntimeError('CDN has not served the expected commit yet')
                  if hashlib.sha256(html).hexdigest() != metadata.get('htmlSha256'):
                      raise RuntimeError('Published HTML does not match the build digest')
                  if b'Lattice' not in html:
                      raise RuntimeError('Unexpected application entry point')
                  print('Verified live deployment:', base)
                  print('Commit:', expected)
                  print('HTML SHA-256:', metadata['htmlSha256'])
                  print('HTTP 200; HTTPS; exact source commit and application bytes verified.')
                  break
              except Exception as error:
                  failure = error
                  print('Verification attempt', attempt + 1, 'of 12:', error, flush=True)
                  if attempt < 11:
                      time.sleep(5)
          else:
              raise RuntimeError('Published deployment verification failed') from failure
          PY
